name: NeonCasaScanner
options:
  bundleIdPrefix: com.edisonacdc
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  NeonCasaScanner:
    type: application
    platform: iOS
    sources: [NeonCasaScanner]
    info:
      path: NeonCasaScanner/Info.plist
      properties:
        CFBundleDisplayName: NeonCasa Scanner
        NSCameraUsageDescription: Fotocamera e LiDAR servono per misurare le stanze e creare la planimetria da importare in NeonCasa 3D.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edisonacdc.neoncasascanner
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
